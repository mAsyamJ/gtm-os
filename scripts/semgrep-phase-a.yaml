rules:
  - id: phase-a-unsafe-yaml
    languages: [python]
    severity: ERROR
    message: Governance must use a reviewed SafeLoader and reject aliases.
    pattern-either:
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.load($INPUT)
  - id: phase-a-shell-execution
    languages: [python]
    severity: ERROR
    message: Use fixed argv without a shell for local audit commands.
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: os.system(...)
  - id: phase-a-outbound-client
    languages: [python]
    severity: ERROR
    message: Governance scripts must remain offline; network providers belong to later adapters.
    pattern-either:
      - pattern: import requests
      - pattern: import httpx
      - pattern: import urllib.request
      - pattern: from urllib import request
  - id: runtime-outbound-client
    languages: [typescript, javascript]
    severity: ERROR
    message: Phase B core/adapters must not call a live network provider.
    patterns:
      - pattern-either:
          - pattern: fetch(...)
          - pattern: import $X from "node:http"
          - pattern: import $X from "node:https"
          - pattern: import $X from "http"
          - pattern: import $X from "https"
          - pattern: import $X from "axios"
          - pattern: import $X from "undici"
      # Approved router liveness probe only: fixed loopback endpoint, no redirects.
      - pattern-not: fetch('http://127.0.0.1:13456/health', {signal:AbortSignal.timeout(2000),redirect:'error'})
  - id: runtime-shell-execution
    languages: [typescript, javascript]
    severity: ERROR
    message: Do not execute shell commands from the runtime core or adapters.
    pattern-either:
      - pattern: import { exec as $EXEC } from "node:child_process"
      - pattern: import { execSync as $EXEC } from "node:child_process"
      - pattern: eval(...)
