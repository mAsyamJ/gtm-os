id: founder-engineering-research
version: 4
description: "Founder engineering evidence to original technical content and manual HOLD"
trigger: "manual invocation; no unattended scheduler installed"
owner: founder-brand
tenant: REQUIRED_AT_RUNTIME
risk_tier: LOCAL_RESEARCH_WITH_EXPLICIT_NETWORK_AND_MODEL_GATES
inputs:
  - "tenant, dataset, source/review revisions and optional selected brief"
  - "explicit collection permission or approved editorial quota when required"
stages:
  - id: stage_1
    tool: project_adapter
    skill: claim-verification
    input: "tenant-bound reviewed inputs and previous immutable handoff"
    output: "hashed local artifact or explicit blocker"
    acceptance: "evidence, tenant, license, resource and permission gates pass"
  - id: stage_2
    tool: project_adapter
    skill: founder-led-growth
    input: "tenant-bound reviewed inputs and previous immutable handoff"
    output: "hashed local artifact or explicit blocker"
    acceptance: "evidence, tenant, license, resource and permission gates pass"
  - id: stage_3
    tool: project_adapter
    skill: graphic-design
    input: "tenant-bound reviewed inputs and previous immutable handoff"
    output: "hashed local artifact or explicit blocker"
    acceptance: "evidence, tenant, license, resource and permission gates pass"
  - id: stage_4
    tool: project_adapter
    skill: social-publishing
    input: "tenant-bound reviewed inputs and previous immutable handoff"
    output: "hashed local artifact or explicit blocker"
    acceptance: "evidence, tenant, license, resource and permission gates pass"
outputs: "source-qualified report or immutable manual HOLD package"
approval_gate: HUMAN_APPROVAL_REQUIRED_PER_EXTERNAL_ACTION
cost_policy: DEFAULT_ZERO_PAID_API_SPEND
retry_policy: "bounded; retries consume durable quotas; no provider escalation"
resume_checkpoint: "selected brief/source/review/governance hashes and tenant-prefixed cycle key"
compensation: "pause affected stage; preserve receipts; changed inputs require new revision"
metrics:
  - "reviewed source coverage and verified useful outcomes"
terminal_states: [COMPLETED_LOCAL, AWAITING_APPROVAL, BLOCKED, FAILED, CANCELLED]
