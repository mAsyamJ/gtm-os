id: weekly-founder-review
version: 1
description: "weekly founder and product scorecard with decisions"
trigger: "manual command or explicit authorized scheduler"
owner: chief-gtm
tenant: "REQUIRED_AT_RUNTIME"
risk_tier: "LOW_READ_ONLY_UNTIL_ACTION_GATE"
inputs:
  - "tenant profile and scoped AGENTS.md"
  - "source IDs or declared synthetic fixture"
  - "approved local task request"
stages:
  - id: step_1
    tool: manual
    skill: analytics-attribution
    input: "validated output of prior step, tenant source cards and config"
    output: "analytics-attribution validated artifact"
    acceptance: "source, tenant, checksum and permission checks PASS"
  - id: step_2
    tool: manual
    skill: weekly-founder-brief
    input: "validated output of prior step, tenant source cards and config"
    output: "weekly-founder-brief validated artifact"
    acceptance: "source, tenant, checksum and permission checks PASS"
  - id: step_3
    tool: manual
    skill: campaign-architecture
    input: "validated output of prior step, tenant source cards and config"
    output: "campaign-architecture validated artifact"
    acceptance: "source, tenant, checksum and permission checks PASS"
outputs: "weekly_scorecard,decision_brief"
approval_gate: "HUMAN_APPROVAL_REQUIRED_PER_EXTERNAL_ACTION"
cost_policy: "DEFAULT_ZERO_PAID_API_SPEND"
retry_policy: "bounded exponential backoff, reconcile ambiguous external write"
resume_checkpoint: "durable local job ID after each validated stage"
compensation: "pause affected queue; invalidate approval if payload changed"
metrics:
  - "artifact quality and review failure count"
  - "verified useful outcome, not vanity traffic alone"
terminal_states: [COMPLETED_LOCAL, AWAITING_APPROVAL, BLOCKED, FAILED, CANCELLED]
